    <rect x="252" y="340" width="540" height="16" rx="8" fill="#ffffff30"/><rect x="252" y="380" width="500" height="16" rx="8" fill="#ffffff1e"/><rect x="252" y="420" width="520" height="16" rx="8" fill="#ffffff1e"/><rect x="252" y="460" width="340" height="16" rx="8" fill="#ffffff1e"/>
    <text x="252" y="522" font-size="18" font-weight="600" fill="#9CA0AB">Sources: 3 contracts · 2 policies</text>
